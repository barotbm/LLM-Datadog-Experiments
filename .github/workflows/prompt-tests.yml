name: Prompt Tests and Validation

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'LLMJudgePipeline/Prompts/**'
      - 'LLMJudgePipeline.Tests/**'
      - '.github/workflows/prompt-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'LLMJudgePipeline/Prompts/**'
      - 'LLMJudgePipeline.Tests/**'

jobs:
  validate-prompts:
    name: Validate Prompt Schema
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run Schema Validation Tests
      run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~PromptSchemaValidatorTests" --verbosity normal
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: schema-validation-results
        path: '**/TestResults/*.trx'

  registry-tests:
    name: Prompt Registry Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run Registry Tests
      run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~PromptRegistryTests" --verbosity normal
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: registry-test-results
        path: '**/TestResults/*.trx'

  golden-dataset-eval:
    name: Golden Dataset Evaluation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run Golden Dataset Tests
      run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~GoldenDatasetTests" --verbosity normal
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: golden-dataset-results
        path: '**/TestResults/*.trx'

  all-prompt-tests:
    name: Run All Prompt Tests
    runs-on: ubuntu-latest
    needs: [validate-prompts, registry-tests, golden-dataset-eval]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore --configuration Release
    
    - name: Run All Tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Prompt Test Results
        path: '**/TestResults/*.trx'
        reporter: dotnet-trx
        fail-on-error: true
    
    - name: Upload Coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: all-test-results
        path: '**/TestResults/*.trx'

  lint-prompts:
    name: Lint Prompt JSON Files
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate JSON Format
      run: |
        echo "Validating JSON files in Prompts directory..."
        find LLMJudgePipeline/Prompts -name "*.json" -type f | while read file; do
          echo "Validating $file"
          if ! python3 -m json.tool "$file" > /dev/null 2>&1; then
            echo "::error file=$file::Invalid JSON syntax"
            exit 1
          fi
        done
    
    - name: Check Semantic Versioning
      run: |
        echo "Checking semantic versioning in prompt filenames..."
        find LLMJudgePipeline/Prompts -name "*.prompt.json" -type f | while read file; do
          filename=$(basename "$file")
          if ! echo "$filename" | grep -qE "^[a-z-]+-v[0-9]+\.[0-9]+\.[0-9]+\.prompt\.json$"; then
            echo "::error file=$file::Invalid filename format. Expected: <name>-v<X.Y.Z>.prompt.json"
            exit 1
          fi
        done
